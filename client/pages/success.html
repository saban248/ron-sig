<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <meta charset="UTF-8">
  <title>הצלחה!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: "Segoe UI", "Arial", sans-serif;
      background: linear-gradient(135deg, #38b000, #70e000);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .card {
      background-color: rgba(0, 0, 0, 0.15);
      border-radius: 16px;
      padding: 40px 30px;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      animation: fadeIn 0.7s ease-out;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 0.3em;
    }

    p {
      font-size: 1.2em;
      margin-top: 0;
    }

    .checkmark {
      font-size: 60px;
      color: #fff;
      margin-bottom: 20px;
    }

    .btn {
      display: inline-block;
      margin-top: 25px;
      padding: 10px 25px;
      font-size: 16px;
      background: white;
      color: #38b000;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.3s ease;
    }

    .btn:hover {
      background: #f0f0f0;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="checkmark"><i class="fa-solid fa-check" style="color: #fff;font-size: 3em;"></i></div>
    <h1>הפעולה הושלמה בהצלחה</h1>
    <p>תודה! הנתונים נקלטו והקובץ נחתם.</p>
    <a class="btn" onclick="window.close()">סגירה</a>
  </div>

</body>
</html>
