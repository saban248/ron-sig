

<div class="tab-clients-home">
    <div class="tab-menu-clients">
        <div class="menu-item">
            <div class="search-box" ondblclick="toggleSearch(this.id)" id="searchclients">
                <input type="text" class="search-input search-input-closed" placeholder="חפש..." maxlength="25">
                <button type="button" class="close-search">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
        </div>
        <div class="menu-item">
            <button type="button" class="general-button btn-t-home btn-refersh">
                <i class="fa-solid fa-arrows-rotate"></i>
                <span>עדכון</span>
            </button>
        </div>
    </div>

    <div class="list-clients">
        {% for client in clients %}
            <div class="client-box">
                <div class="client-header">
                    <span>{{get_first_word_fullname(client.fullname)}}</span>
                </div>
                <div class="client-body">
                    <div class="client-view-info">

                        <div class="client-item">
                            <i><i class="fa-regular fa-user" style="color: #62bcba;"></i></i>
                            <span>{{ client.fullname }}</span>
                        </div>
                        <div class="client-item">
                            <i><i class="fa-solid fa-phone-flip" style="color: #62bcba;"></i></i>
                            <span>{{ client.phone }}</span>
                        </div> 
                        <div class="client-item no-mobile">
                            <i><i class="fa-solid fa-id-card" style="color: #62bcba;"></i></i>
                            <span>{{client.identify}}</span>
                        </div>
                    </div>
                    <div class="client-item menu" onclick="toggleClienMenu(event, '{{client.fullname}}', '{{client.xid}}')">
                        <i class="fa-solid fa-ellipsis" style="color: #62bcba;"></i>
                    </div>
                </div>
            </div>
        {% endfor %}

        <div id="generalmenu" class="general-menu">
            <div class="general-menu-title" style="background: rgb(11, 13, 16);text-align: center;border-radius:6px;">
                <span id="mtitle" style="opacity: 0.6;"></span>
            </div>
            <div class="general-menu-item" onclick="startRentEquipment()">
                <i class="fa-solid fa-square-plus" style="color: #50cac8;"></i>
                <span>השכרת ציוד</span>
            </div>
            <div class="general-menu-item" onclick="showClientDetails()">
                <i class="fa-solid fa-id-card" style="color: #62bcba;"></i>
                <span>פרטי לקוח</span>
            </div>
            <div class="menu-seperate"></div>
            <div class="general-menu-item">
                <i class="fa-solid fa-phone-flip" style="color: #7dbc62;"></i>
                <span>חייג</span>
            </div>
            <div class="general-menu-item">
                <i class="fa-solid fa-comment-dots" style="color: #59cb6c;"></i>
                <span>WhatsApp</span>
            </div>
            <div class="menu-seperate"></div>
            <div class="general-menu-item">
                <i class="fa-solid fa-trash" style="color: #d64f37;"></i>
                <span>מחיקה</span>
            </div>
        </div>
    </div>
</div>

<div class="sidebar" id="newrent">
    <div class="sidebar-title">
        <i class="fa-solid fa-circle-xmark" onclick="cancelNewRent()"></i>
        <span>השכרה חדשה</span>
    </div>
    <div class="sidebar-items" id="newrent_items">
        <div class="sidebar-item" id="nritem1">
            <div class="item-title">
                <i class="fa-regular fa-square" id="nriconstep1" onclick="toggleSidebarItem(1)"></i>    
                <span>כתובת האירוע</span>
            </div>
            <div class="item-inpus show" id="nrstep1">
                <div class="inp-step">
                    <label class="label-inp">
                        <i class="fa-solid fa-map-location"></i>
                        כתובת האירוע (אופציונלי)
                    </label>
                    <input type="text" id="raddress" placeholder="..." class="general-input input-step" required oninput="NewRentCompleteStep(1)">
                </div>
                <button type="button" class="general-button item-button-step" onclick="NewRentShowNextStep(1)">
                    <span>לשלב הבא</span>
                </button>
            </div>
        </div>
        <div class="sidebar-item" id="nritem2">
            <div class="item-title">
                <i class="fa-regular fa-square" id="nriconstep2" onclick="toggleSidebarItem(2)"></i>    
                <span>תאריך תחילת השכרה</span>
            </div>
            <div class="item-inpus show" id="nrstep2">
                <div class="inp-step">
                    <label class="label-inp">
                        <i class="fa-solid fa-map-location"></i>
                        תאריך מלא
                    </label>
                    <input type="text" id="rstarttime" placeholder="..." class="general-input input-step" required oninput="NewRentCompleteStep(2)">
                </div>
                <button type="button" class="general-button item-button-step" onclick="NewRentShowNextStep(2)">
                    <span>לשלב הבא</span>
                </button>
            </div>
        </div>
        <div class="sidebar-item" id="nritem3">
            <div class="item-title">
                <i class="fa-regular fa-square" id="nriconstep3" onclick="toggleSidebarItem(3)"></i>    
                <span>תאריך סיום השכרה</span>
            </div>
            <div class="item-inpus show" id="nrstep3">
                <div class="inp-step">
                    <label class="label-inp">
                        <i class="fa-solid fa-map-location"></i>
                        תאריך מלא
                    </label>
                    <input type="text" id="rendtime" placeholder="..." class="general-input input-step" required oninput="NewRentCompleteStep(3)">
                </div>
                <button type="button" class="general-button item-button-step" onclick="NewRentShowNextStep(3)">
                    <span>לשלב הבא</span>
                </button>
            </div>
        </div>
    </div>
</div>

<div class="sidebar" id="clientinfo">
        <div class="sidebar-title">
        <i class="fa-solid fa-circle-xmark" onclick="closeClientDetails()"></i>
        <span id="clientinfoname"></span>
    </div>
    <div></div>
</div>
