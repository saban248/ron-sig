
<div class="tab-equip-home">
    <div class="tab-menu-equip">
        <div class="menu-item" onclick="startNewEquipment()">
            <button type="button" class="general-button btn-t-home btn-t-eq-new">
                <i class="fa-solid fa-square-plus"></i>
                חדש
            </button>
        </div>
    </div>

    <div class="list-equips">
        {% for equipment in equipments %}
        <div class="box-equipment" style='background-image: url("/static/images/{{equipment.img_name}}");' id="{{equipment.eid}}">
           <div class="box-equip-header">
                <div class="equip-img">
                </div>
           </div> 
           <div class="box-equip-body">
                <!-- name-->
                <div class="box-eq-title">
                    {{equipment.name}}
                </div>
                <div class="body-equip-info">
                    <div class="box-eq-info">
                        <!-- crowd -->
                        <div class="equip-info">
                            <i class="fa-solid fa-people-group"></i>
                            <span>{{equipment.count_people}}</span>
                        </div>
                        <!-- count -->
                        <div class="equip-info">
                            <i class="fa-solid fa-box"></i>
                            <span>{{equipment.count}}</span>
                        </div>
                        <!-- company -->
                        <div class="equip-info">
                            <i class="fa-solid fa-crown"></i>
                            <span>{{equipment.company}}</span>
                        </div>
                    </div>

                </div>
           </div>
           
        </div>
        {% endfor %}
    </div>


<div class="sidebar" id="newequip">
    <div class="sidebar-title">
        <i class="fa-solid fa-circle-xmark" onclick="cancelNewEquipment()"></i>
        <span>ציוד חדש</span>
    </div>
    <div class="sidebar-items" id="newequip_items">
        <div class="sidebar-item" id="eqitem1">
            <div class="item-title">
                <i class="fa-regular fa-square" id="eqiconstep1" onclick="toggleSidebarItemEquip(1)"></i>    
                <span>שם מלא</span>
            </div>
            <div class="item-inpus show" id="eqstep1">
                <div class="inp-step">
                    <label class="label-inp">
                        <i class="fa-solid fa-map-location"></i>
                        שם הציוד
                    </label>
                    <input type="text" id="eqname" placeholder="..." class="general-input input-step" required oninput="NewEquipmentCompleteStep(1)">
                </div>
                <button type="button" class="general-button item-button-step" onclick="NewEquipShowNextStep(1)">
                    <span>לשלב הבא</span>
                </button>
            </div>
        </div>
        <div class="sidebar-item" id="eqitem2">
