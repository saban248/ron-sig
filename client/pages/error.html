<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>שגיאה</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: "Segoe UI", "Arial", sans-serif;
      background: linear-gradient(135deg, #ff4e50, #f9d423);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .card {
      background-color: rgba(0, 0, 0, 0.15);
      border-radius: 16px;
      padding: 40px 30px;
      max-width: 500px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      animation: fadeIn 0.6s ease-out;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 0.3em;
    }

    p {
      font-size: 1.3em;
    }

    .emoji {
      font-size: 60px;
      margin-bottom: 20px;
    }

    .btn {
      display: inline-block;
      margin-top: 25px;
      padding: 10px 25px;
      font-size: 16px;
      background: white;
      color: #ff4e50;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.3s ease;
    }

    .btn:hover {
      background: #f0f0f0;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="emoji"><i class="fa-solid fa-circle-exclamation" style="color: #f9d423;"></i></div>
    <h1>אירעה שגיאה</h1>
    <p>{{ error}}</p>
    <a class="btn">חזרה</a>
  </div>

</body>
</html>
